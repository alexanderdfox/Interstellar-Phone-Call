<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeded Pi-Random Lotto Frequencies Oscilloscope</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
      background-color: #121820;
      color: #e0e6ed;
    }
    .card {
      background: #1b2430;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid #2c3e50;
      margin-bottom: 20px;
    }
    .original-number {
      font-size: 0.9rem;
      color: #94a3b8;
      word-break: break-all;
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-family: monospace;
    }
    canvas {
      width: 100%;
      height: 250px;
      background-color: #050b14;
      border: 2px solid #00ffcc;
      border-radius: 6px;
      margin-top: 16px;
    }
    .freq-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }
    .freq-box {
      background: #253342;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      color: #00ffcc;
      font-weight: bold;
    }
    button {
      background-color: #00ffcc;
      color: #050b14;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #00cca3;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Base Seed Number & Pi PRNG</h2>
    <div class="original-number">
      10314424798490535546171949056
    </div>

    <h2>Dynamically Generated Frequencies (Pairs × 100 Hz)</h2>
    <div class="freq-grid" id="freqGrid">
      <!-- Populated dynamically -->
    </div>

    <canvas id="scopeCanvas"></canvas>

    <div>
      <button id="toggleBtn" onclick="toggleAudio()">Play Generated Frequencies</button>
    </div>
  </div>

  <script>
    const baseNumberStr = "10314424798490535546171949056";
    const baseSeed = Number(BigInt(baseNumberStr) % 2147483647n);

    // Linear Congruential Generator (LCG) PRNG using seed + Pi factor
    function seededRandom(step) {
      const piFactor = Math.PI * 10000;
      let state = (baseSeed + step * piFactor) % 2147483647;
      state = (state * 16807) % 2147483647;
      return (state - 1) / 2147483646;
    }

    let currentFreqs = [];
    let audioCtx, analyser, isPlaying = false, oscillators = [];

    function generateNewFrequencies() {
      const maxIndex = baseNumberStr.length - 2;
      const selectedPairs = [];
      const usedIndices = new Set();
      
      let step = 0;
      while (selectedPairs.length < 6) {
        const randVal = seededRandom(step + Math.random() * 1000); // mixes seed & Pi
        const index = Math.floor(randVal * (maxIndex + 1));
        
        if (!usedIndices.has(index)) {
          usedIndices.add(index);
          const pair = baseNumberStr.substring(index, index + 2);
          selectedPairs.push(pair);
        }
        step++;
      }

      // Convert pairs to frequencies (Pair * 100 Hz)
      currentFreqs = selectedPairs.map(p => parseInt(p, 10) * 100);

      // Update UI grid
      const grid = document.getElementById('freqGrid');
      grid.innerHTML = '';
      currentFreqs.forEach(f => {
        const box = document.createElement('div');
        box.className = 'freq-box';
        box.textContent = f.toLocaleString() + " Hz";
        grid.appendChild(box);
      });
    }

    function toggleAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
      }

      if (isPlaying) {
        oscillators.forEach(osc => osc.stop());
        oscillators = [];
        isPlaying = false;
        document.getElementById('toggleBtn').textContent = "Play Generated Frequencies";
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        // Generate new set on play
        generateNewFrequencies();

        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.12; // Master volume balance

        currentFreqs.forEach(freq => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          osc.connect(masterGain);
          osc.start();
          oscillators.push(osc);
        });

        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);
        isPlaying = true;
        document.getElementById('toggleBtn').textContent = "Stop Audio & Redraw";
        drawScope();
      }
    }

    function drawScope() {
      const canvas = document.getElementById('scopeCanvas');
      const ctx = canvas.getContext('2d');
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function render() {
        if (!isPlaying) return;
        requestAnimationFrame(render);
        analyser.getByteTimeDomainData(dataArray);

        ctx.fillStyle = '#050b14';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#00ffcc';
        ctx.beginPath();

        const sliceWidth = canvas.width * 1.0 / bufferLength;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = v * canvas.height / 2;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);

          x += sliceWidth;
        }

        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();
      }

      render();
    }

    // Initial load view generation
    generateNewFrequencies();
  </script>

</body>
</html>
